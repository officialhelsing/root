<!DOCTYPE html>
<html lang="en" class="bg-black h-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>root</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
            position: fixed;
            width: 100%;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            touch-action: manipulation;
        }
        body {
            color: #d4d4d8;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            transition: background-color 0.5s cubic-bezier(0.16, 1, 0.3, 1), color 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform: scale(0.95);
            transform-origin: center;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
        }
        @media (max-width: 768px), (hover: none) {
            body {
                transform: scale(1) !important;
            }
        }
        ::selection {
            background: rgba(255, 255, 255, 0.25) !important;
            color: inherit !important;
        }
        ::-moz-selection {
            background: rgba(255, 255, 255, 0.25) !important;
            color: inherit !important;
        }
        .cursor {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .fade-out {
            animation: fadeOut 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .vignette-overlay {
            background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.65) 90%);
            pointer-events: none;
            transition: background 0.5s ease;
        }
        * {
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            touch-action: manipulation;
            outline: none !important;
            cursor: default !important;
        }

        .polygon-float {
            animation: polygonFloat 4s ease-in-out infinite;
        }
        @keyframes polygonFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(1.5deg); }
        }
        @keyframes rainbowWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .rainbow-text {
            background: linear-gradient(270deg, #f43f5e, #fbbf24, #34d399, #38bdf8, #818cf8, #e879f9, #f43f5e);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowWave 8s ease infinite;
        }
        @keyframes floatQuestion {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .floating-question {
            display: inline-block;
            animation: floatQuestion 3s ease-in-out infinite;
        }
    </style>
</head>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let targetMouseX = mouseX;
        let targetMouseY = mouseY;
        let audioEnabled = false;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
        }

        function playTone(freq, type, duration, vol = 0.03) {
            if (!audioEnabled) return;
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // Audio context fallback safeguard
            }
        }

        let clickParticles = [];
        window.addEventListener('click', (e) => {
            for (let i = 0; i < 6; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 2 + 0.8;
                clickParticles.push({
                    x: e.clientX,
                    y: e.clientY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 2 + 0.8,
                    alpha: 0.9
                });
            }
        });

        window.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX;
            targetMouseY = e.clientY;
        });

        window.addEventListener('selectstart', (e) => {
            e.preventDefault();
        });

        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initDistantStars();
        }
        window.addEventListener('resize', resizeCanvas);

        let distantStars = [];
        let shootingStars = [];
        let currentTheme = 'dark';

        function initDistantStars() {
            distantStars = [];
            const count = Math.floor((((canvas.width * canvas.height) / 45000) * 2.78) * 0.2904 * 1.2 * 1.2 * 1.1 * 1.2 * 1.5 * 1.2 * 1.5 * 1.5 * 1.5 * 1.5 * 0.9 * 0.9 * 0.8 * 0.9 * 0.9 * 0.9 * 0.9 * 0.8 * 0.9 * 0.9 * 0.9 * 0.9 * 0.8 * 0.9 * 0.9 * 0.9 * 0.9 * 1.38 * 1.38 * 1.1 * 0.8 * 1.2 * 1.2 * 1.1 * 0.8);
            const paletteDark = [
                '#ffffff', '#ffffff', '#ffffff',
                '#e0f2fe', '#bae6fd',
                '#fef3c7', '#fde68a',
                '#ede9fe', '#ffedd5'
            ];
            const paletteLight = [
                '#27272a', '#3f3f46', '#52525b', '#334155', '#475569'
            ];
            for (let i = 0; i < count; i++) {
                let speed = Math.random() * 0.12 + 0.04;
                let angle = Math.PI * 0.75 + (Math.random() - 0.5) * 0.25;
                let vx = Math.cos(angle) * speed;
                let vy = Math.sin(angle) * speed;

                distantStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 0.8 + 0.4,
                    alpha: Math.random() * 0.35 + 0.15,
                    vx: vx,
                    vy: vy,
                    colorDark: paletteDark[Math.floor(Math.random() * paletteDark.length)],
                    colorLight: paletteLight[Math.floor(Math.random() * paletteLight.length)]
                });
            }
        }

        resizeCanvas();

        function spawnShootingStar() {
            if (Math.random() < 0.005 && shootingStars.length < 1) {
                const angles = [
                    Math.PI * 0.75,
                    Math.PI * 0.85,
                    Math.PI * 1.15,
                    Math.PI
                ];
                let travelAngle = angles[Math.floor(Math.random() * angles.length)] + (Math.random() - 0.5) * 0.4;
                let speed = Math.random() * 3 + 2;
                let vx = Math.cos(travelAngle) * speed;
                let vy = Math.sin(travelAngle) * speed;

                let startX = vx < 0 ? canvas.width + 150 : -150;
                let startY = Math.random() * (canvas.height * 0.6);

                shootingStars.push({
                    x: startX,
                    y: startY,
                    vx: vx,
                    vy: vy,
                    length: Math.random() * 300 + 200,
                    opacity: 0.75
                });
            }
        }

        function renderStars() {
            mouseX += (targetMouseX - mouseX) * 0.05;
            mouseY += (targetMouseY - mouseY) * 0.05;
            let parallaxOffsetX = (mouseX - window.innerWidth / 2) * 0.00015;
            let parallaxOffsetY = (mouseY - window.innerHeight / 2) * 0.00015;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let s of distantStars) {
                s.x += s.vx + parallaxOffsetX;
                s.y += s.vy + parallaxOffsetY;

                if (s.x < -10) s.x = canvas.width + 10;
                if (s.x > canvas.width + 10) s.x = -10;
                if (s.y < -10) s.y = canvas.height + 10;
                if (s.y > canvas.height + 10) s.y = -10;

                ctx.save();
                ctx.globalAlpha = s.alpha;
                ctx.fillStyle = (currentTheme === 'light') ? s.colorLight : s.colorDark;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            spawnShootingStar();
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';

            for (let i = clickParticles.length - 1; i >= 0; i--) {
                let p = clickParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.025;

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = currentTheme === 'light' ? '#27272a' : '#ffffff';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) {
                    clickParticles.splice(i, 1);
                }
            }

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                let s = shootingStars[i];
                s.x += s.vx;
                s.y += s.vy;
                s.opacity -= 0.003;

                ctx.save();
                ctx.globalAlpha = Math.max(0, s.opacity);
                let tailX = s.x - s.vx * 35;
                let tailY = s.y - s.vy * 35;

                let gradient = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
                if (currentTheme === 'light') {
                    gradient.addColorStop(0, 'rgba(63, 63, 70, 0.85)');
                    gradient.addColorStop(1, 'rgba(63, 63, 70, 0)');
                } else {
                    gradient.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                }
                
                ctx.strokeStyle = gradient;
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(tailX, tailY);
                ctx.stroke();
                ctx.restore();

                if (s.opacity <= 0 || s.x < -300 || s.x > canvas.width + 300 || s.y > canvas.height + 200 || s.y < -100) {
                    shootingStars.splice(i, 1);
                }
            }

            requestAnimationFrame(renderStars);
        }

        class MetatronsCubeGenerator {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                if (!this.canvas) return;
                this.ctx = this.canvas.getContext('2d');
                
                const dpr = (window.devicePixelRatio || 1) * 2.5;
                this.cssSize = 240; // Balanced size to ensure comfortable surrounding black space
                this.canvas.width = this.cssSize * dpr;
                this.canvas.height = this.cssSize * dpr;
                this.canvas.style.width = `${this.cssSize}px`;
                this.canvas.style.height = `${this.cssSize}px`;
                this.ctx.scale(dpr, dpr);
                
                this.width = this.cssSize;
                this.height = this.cssSize;
                this.spawnProgress = 0;
                
                this.thetaX = 0.3;
                this.thetaY = 0.4;
                this.thetaZ = 0.1;
                
                this.isDragging = false;
                this.hasDragged = false;
                this.startX = 0;
                this.startY = 0;
                this.lastMouseX = 0;
                this.lastMouseY = 0;
                
                this.canvas.style.cursor = 'grab';
                this.canvas.addEventListener('mousedown', (e) => {
                    this.isDragging = true;
                    this.hasDragged = false;
                    this.startX = e.clientX;
                    this.startY = e.clientY;
                    this.lastMouseX = e.clientX;
                    this.lastMouseY = e.clientY;
                    this.canvas.style.cursor = 'grabbing';
                });
                window.addEventListener('mousemove', (e) => {
                    if (!this.isDragging) return;
                    let dx = e.clientX - this.lastMouseX;
                    let dy = e.clientY - this.lastMouseY;
                    if (Math.abs(e.clientX - this.startX) > 3 || Math.abs(e.clientY - this.startY) > 3) {
                        this.hasDragged = true;
                    }
                    this.thetaY += dx * 0.008;
                    this.thetaX += dy * 0.008;
                    this.lastMouseX = e.clientX;
                    this.lastMouseY = e.clientY;
                });
                window.addEventListener('mouseup', () => {
                    if (this.isDragging && !this.hasDragged) {
                        navigateTo('metatrons-cube');
                    }
                    this.isDragging = false;
                    if (this.canvas) this.canvas.style.cursor = 'grab';
                });

                this.canvas.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        this.isDragging = true;
                        this.hasDragged = false;
                        this.startX = e.touches[0].clientX;
                        this.startY = e.touches[0].clientY;
                        this.lastMouseX = e.touches[0].clientX;
                        this.lastMouseY = e.touches[0].clientY;
                    }
                });
                window.addEventListener('touchmove', (e) => {
                    if (!this.isDragging || e.touches.length !== 1) return;
                    let dx = e.touches[0].clientX - this.lastMouseX;
                    let dy = e.touches[0].clientY - this.lastMouseY;
                    if (Math.abs(e.touches[0].clientX - this.startX) > 3 || Math.abs(e.touches[0].clientY - this.startY) > 3) {
                        this.hasDragged = true;
                    }
                    this.thetaY += dx * 0.008;
                    this.thetaX += dy * 0.008;
                    this.lastMouseX = e.touches[0].clientX;
                    this.lastMouseY = e.touches[0].clientY;
                });
                window.addEventListener('touchend', () => {
                    if (this.isDragging && !this.hasDragged) {
                        navigateTo('metatrons-cube');
                    }
                    this.isDragging = false;
                });

                this.dustParticles = [];
                for (let i = 0; i < 40; i++) {
                    this.dustParticles.push({
                        angle: Math.random() * Math.PI * 2,
                        radius: Math.random() * 95 + 20,
                        y: (Math.random() - 0.5) * 140,
                        speed: (Math.random() - 0.5) * 0.025,
                        size: Math.random() * 1.5 + 0.5,
                        hueOffset: Math.random() * 360
                    });
                }

                this.armillaryRings = [];
                for (let ringIdx = 0; ringIdx < 3; ringIdx++) {
                    let ringNodes = [];
                    let r = 85 + ringIdx * 11;
                    let count = 16;
                    for (let i = 0; i < count; i++) {
                        let angle = i * ((Math.PI * 2) / count);
                        ringNodes.push({
                            angle: angle,
                            radius: r,
                            axis: ringIdx,
                            speed: (ringIdx % 2 === 0 ? 1 : -1) * 0.007
                        });
                    }
                    this.armillaryRings.push(ringNodes);
                }

                this.animId = null;
                this.animate();
            }

            animate() {
                if (!this.canvas || !this.ctx) return;

                if (this.spawnProgress < 1) {
                    this.spawnProgress += 0.015;
                    if (this.spawnProgress > 1) this.spawnProgress = 1;
                }

                this.ctx.clearRect(0, 0, this.width, this.height);

                if (!this.isDragging) {
                    this.thetaX += 0.0035;
                    this.thetaY += 0.0055;
                    this.thetaZ += 0.002;
                }

                const cx = this.width / 2;
                const cy = this.height / 2;
                const timeHue = (performance.now() * 0.04) % 360;

                let vertices = [];
                vertices.push({ x: 0, y: 0, z: 0, type: 'node', hue: 0 });
                let r1 = 44; // Inner ring radius adjusted for comfortable padding
                for (let i = 0; i < 6; i++) {
                    let angle = i * (Math.PI / 3);
                    vertices.push({
                        x: Math.cos(angle) * r1,
                        y: Math.sin(angle) * r1,
                        z: Math.sin(angle * 2) * 18,
                        type: 'node',
                        hue: i * 60
                    });
                }
                let r2 = 88; // Outer ring radius adjusted for comfortable padding
                for (let i = 0; i < 6; i++) {
                    let angle = i * (Math.PI / 3) + (Math.PI / 6);
                    vertices.push({
                        x: Math.cos(angle) * r2,
                        y: Math.sin(angle) * r2,
                        z: -Math.sin(angle * 2) * 18,
                        type: 'node',
                        hue: i * 60 + 30
                    });
                }
                vertices.push({ x: 0, y: 0, z: 62, type: 'apex', hue: 120 });
                vertices.push({ x: 0, y: 0, z: -62, type: 'apex', hue: 300 });

                let merkabaVertices = [];
                let mkSizes = [44, 72];
                for (let sIdx = 0; sIdx < mkSizes.length; sIdx++) {
                    let mkSize = mkSizes[sIdx];
                    for (let i = 0; i < 8; i++) {
                        let signX = (i & 1) ? 1 : -1;
                        let signY = (i & 2) ? 1 : -1;
                        let signZ = (i & 4) ? 1 : -1;
                        merkabaVertices.push({
                            x: signX * mkSize * 0.7,
                            y: signY * mkSize * 0.7,
                            z: signZ * mkSize * 0.7,
                            type: 'merkaba',
                            subType: sIdx,
                            hue: (i * 45 + sIdx * 90) % 360
                        });
                    }
                }

                let allVerts = [...vertices, ...merkabaVertices];
                let projected = [];

                let cosX = Math.cos(this.thetaX), sinX = Math.sin(this.thetaX);
                let cosY = Math.cos(this.thetaY), sinY = Math.sin(this.thetaY);
                let cosZ = Math.cos(this.thetaZ), sinZ = Math.sin(this.thetaZ);

                for (let i = 0; i < allVerts.length; i++) {
                    let v = allVerts[i];
                    let x = v.x, y = v.y, z = v.z;

                    if (v.type === 'merkaba') {
                        let mkAngle = performance.now() * 0.001 * (v.subType === 0 ? 1 : -1.2);
                        let mx = x * Math.cos(mkAngle) - z * Math.sin(mkAngle);
                        let mz = x * Math.sin(mkAngle) + z * Math.cos(mkAngle);
                        x = mx; z = mz;
                    }

                    let y1 = y * cosX - z * sinX;
                    let z1 = y * sinX + z * cosX;
                    let x1 = x;
                    let x2 = x1 * cosY + z1 * sinY;
                    let z2 = -x1 * sinY + z1 * cosY;
                    let y2 = y1;
                    let x3 = x2 * cosZ - y2 * sinZ;
                    let y3 = x2 * sinZ + y2 * cosZ;
                    let z3 = z2;

                    let distance = 250;
                    let scale = (distance / (distance + z3)) * this.spawnProgress;
                    let px = cx + x3 * scale;
                    let py = cy + y3 * scale;

                    projected.push({
                        px: px,
                        py: py,
                        z: z3,
                        type: v.type,
                        hue: (v.hue + timeHue) % 360,
                        alpha: (z3 + 120) / 240,
                        scale: scale,
                        origIndex: i
                    });
                }

                let lines = [];
                for (let i = 0; i < vertices.length; i++) {
                    for (let j = i + 1; j < vertices.length; j++) {
                        let p1 = projected[i];
                        let p2 = projected[j];
                        let distSq = Math.pow(p1.px - p2.px, 2) + Math.pow(p1.py - p2.py, 2);
                        if (distSq < 52000 * this.spawnProgress) {
                            lines.push({ p1, p2, avgZ: (p1.z + p2.z) / 2, type: 'cube' });
                        }
                    }
                }

                let mkStartIndex = vertices.length;
                for (let i = 0; i < merkabaVertices.length; i++) {
                    for (let j = i + 1; j < merkabaVertices.length; j++) {
                        let p1 = projected[mkStartIndex + i];
                        let p2 = projected[mkStartIndex + j];
                        lines.push({ p1, p2, avgZ: (p1.z + p2.z) / 2, type: 'merkaba' });
                    }
                }

                lines.sort((a, b) => a.avgZ - b.avgZ);

                for (let l of lines) {
                    let alphaFactor = Math.max(0.12, (l.avgZ + 120) / 240);
                    let lineHue = (l.p1.hue + l.p2.hue) / 2;
                    this.ctx.beginPath();
                    this.ctx.moveTo(l.p1.px, l.p1.py);
                    this.ctx.lineTo(l.p2.px, l.p2.py);
                    if (l.type === 'merkaba') {
                        this.ctx.strokeStyle = `hsla(${lineHue}, 90%, 65%, ${0.5 * this.spawnProgress * alphaFactor})`;
                        this.ctx.lineWidth = 0.9;
                    } else {
                        this.ctx.strokeStyle = `hsla(${lineHue}, 80%, 60%, ${0.3 * this.spawnProgress * alphaFactor})`;
                        this.ctx.lineWidth = 0.7;
                    }
                    this.ctx.stroke();
                }

                for (let ringIdx = 0; ringIdx < this.armillaryRings.length; ringIdx++) {
                    let ringNodes = this.armillaryRings[ringIdx];
                    let ringProjected = [];
                    for (let node of ringNodes) {
                        node.angle += node.speed;
                        let rx = 0, ry = 0, rz = 0;
                        if (ringIdx === 0) {
                            rx = Math.cos(node.angle) * node.radius;
                            ry = Math.sin(node.angle) * node.radius;
                            rz = 0;
                        } else if (ringIdx === 1) {
                            rx = Math.cos(node.angle) * node.radius;
                            ry = 0;
                            rz = Math.sin(node.angle) * node.radius;
                        } else {
                            rx = 0;
                            ry = Math.cos(node.angle) * node.radius;
                            rz = Math.sin(node.angle) * node.radius;
                        }

                        let y1 = ry * cosX - rz * sinX;
                        let z1 = ry * sinX + rz * cosX;
                        let x1 = rx;
                        let x2 = x1 * cosY + z1 * sinY;
                        let z2 = -x1 * sinY + z1 * cosY;
                        let y2 = y1;
                        let x3 = x2 * cosZ - y2 * sinZ;
                        let y3 = x2 * sinZ + y2 * cosZ;
                        let z3 = z2;

                        let distance = 250;
                        let scale = (distance / (distance + z3)) * this.spawnProgress;
                        let px = cx + x3 * scale;
                        let py = cy + y3 * scale;
                        ringProjected.push({ px, py, z: z3, scale });
                    }

                    for (let i = 0; i < ringProjected.length; i++) {
                        let p1 = ringProjected[i];
                        let p2 = ringProjected[(i + 1) % ringProjected.length];
                        let ringHue = (timeHue + ringIdx * 120 + i * 15) % 360;
                        let alpha = Math.max(0.1, (p1.z + 120) / 240);

                        this.ctx.beginPath();
                        this.ctx.moveTo(p1.px, p1.py);
                        this.ctx.lineTo(p2.px, p2.py);
                        this.ctx.strokeStyle = `hsla(${ringHue}, 90%, 65%, ${0.4 * alpha * this.spawnProgress})`;
                        this.ctx.lineWidth = 0.8;
                        this.ctx.stroke();

                        if (i % 2 === 0) {
                            this.ctx.beginPath();
                            this.ctx.arc(p1.px, p1.py, 1.2 * p1.scale, 0, Math.PI * 2);
                            this.ctx.fillStyle = `hsla(${ringHue}, 100%, 75%, ${0.95 * alpha * this.spawnProgress})`;
                            this.ctx.fill();
                        }
                    }
                }

                for (let d of this.dustParticles) {
                    d.angle += d.speed;
                    let dx = Math.cos(d.angle) * d.radius;
                    let dz = Math.sin(d.angle) * d.radius;
                    let dy = d.y;

                    let y1 = dy * cosX - dz * sinX;
                    let z1 = dy * sinX + dz * cosX;
                    let x1 = dx;
                    let x2 = x1 * cosY + z1 * sinY;
                    let z2 = -x1 * sinY + z1 * cosY;
                    let y2 = y1;
                    let x3 = x2 * cosZ - y2 * sinZ;
                    let y3 = x2 * sinZ + y2 * cosZ;
                    let z3 = z2;

                    let distance = 250;
                    let scale = distance / (distance + z3);
                    let px = cx + x3 * scale;
                    let py = cy + y3 * scale;
                    let alpha = Math.max(0.15, (z3 + 120) / 240) * 0.85;
                    let particleHue = (timeHue + d.hueOffset) % 360;

                    this.ctx.beginPath();
                    this.ctx.arc(px, py, d.size * scale, 0, Math.PI * 2);
                    this.ctx.fillStyle = `hsla(${particleHue}, 95%, 70%, ${alpha})`;
                    this.ctx.fill();
                }

                let sortedProjected = [...projected].sort((a, b) => a.z - b.z);
                const baseRadius = 12;

                for (let pt of sortedProjected) {
                    let alphaFactor = Math.max(0.3, pt.alpha);
                    let radius = baseRadius * pt.scale;

                    if (pt.type === 'node' || pt.type === 'apex') {
                        this.ctx.beginPath();
                        this.ctx.arc(pt.px, pt.py, radius, 0, Math.PI * 2);
                        this.ctx.strokeStyle = `hsla(${pt.hue}, 90%, 65%, ${0.6 * this.spawnProgress * alphaFactor})`;
                        this.ctx.lineWidth = pt.type === 'apex' ? 1.4 : 1.0;
                        this.ctx.stroke();

                        this.ctx.beginPath();
                        this.ctx.arc(pt.px, pt.py, 2.2 * this.spawnProgress * pt.scale, 0, Math.PI * 2);
                        this.ctx.fillStyle = `hsla(${pt.hue}, 100%, 75%, ${0.95 * this.spawnProgress * alphaFactor})`;
                        this.ctx.fill();
                    } else if (pt.type === 'merkaba') {
                        this.ctx.beginPath();
                        this.ctx.arc(pt.px, pt.py, 1.8 * this.spawnProgress * pt.scale, 0, Math.PI * 2);
                        this.ctx.fillStyle = `hsla(${pt.hue}, 100%, 70%, ${0.9 * this.spawnProgress * alphaFactor})`;
                        this.ctx.fill();
                    }
                }

                this.animId = requestAnimationFrame(() => this.animate());
            }

            destroy() {
                if (this.animId) cancelAnimationFrame(this.animId);
            }
        }

                    }
                } else if (e.key.toLowerCase() === 't') {
                    toggleTheme();
                } else if (currentState === 'root' && hasInitializedRoot) {
                    if (e.key === '1') navigateTo('research');
                    if (e.key === '2') navigateTo('portal');
                    if (e.key === '3') navigateTo('resume');
                }
            });
        };
    </script>
</body>
</html>
