<!DOCTYPE html>
<html lang="en" class="bg-black h-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>root</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
            position: fixed;
            width: 100%;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            touch-action: manipulation;
        }
        body {
            color: #d4d4d8;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            transition: background-color 0.8s cubic-bezier(0.16, 1, 0.3, 1), color 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transform: scale(0.95);
            transform-origin: center;
        }
        @media (max-width: 768px), (hover: none) {
            body {
                transform: scale(1) !important;
            }
        }
        ::selection {
            background: rgba(255, 255, 255, 0.25) !important;
            color: inherit !important;
        }
        @keyframes fadeInPhase {
            0% { opacity: 0; transform: translateY(8px); filter: blur(6px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .vignette-overlay {
            background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.65) 90%);
            pointer-events: none;
            transition: background 0.8s ease;
        }
        * {
            -webkit-tap-highlight-color: transparent !important;
            touch-action: manipulation;
            outline: none !important;
            cursor: default !important;
        }
        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        @keyframes mediumPixelGlitch {
            0% { filter: contrast(100%) blur(0px); transform: translate(0,0); }
            20% { filter: contrast(280%) blur(2px) hue-rotate(45deg); transform: translate(-2px, 1px); }
            50% { filter: contrast(400%) blur(4px) invert(15%); transform: translate(3px, -2px); }
            70% { filter: contrast(300%) blur(3px) hue-rotate(240deg) saturate(200%); transform: translate(-2px, 2px); }
            85% { filter: contrast(250%) blur(1.5px); transform: translate(-1px, 1px); }
            100% { filter: contrast(100%) blur(0px); transform: translate(0,0); }
        }
        .pixel-glitch-medium {
            animation: mediumPixelGlitch 0.7s steps(5, end) forwards;
            image-rendering: pixelated;
        }
        .typing-cursor::after {
            content: '_';
            display: inline-block;
            margin-left: 2px;
            animation: blinkCursor 0.8s infinite;
            font-weight: normal;
        }
    </style>
</head>
<body class="bg-black h-screen w-screen overflow-hidden relative m-0 p-0 select-none flex flex-col justify-end items-end pb-24 pr-12 sm:pr-24 md:pr-32">
    <canvas id="starfield" class="fixed inset-0 pointer-events-none z-0"></canvas>
    <div class="fixed inset-0 vignette-overlay z-1 pointer-events-none"></div>

    <div id="intro-container" class="fixed bottom-24 right-6 sm:right-24 md:right-32 z-20 text-right font-mono text-xs md:text-sm tracking-widest select-none opacity-0 transition-opacity duration-1000 max-w-[280px] sm:max-w-xl px-4 leading-relaxed">
        <div><span id="typed-intro" class="inline-block max-w-full align-bottom pl-6 text-right whitespace-normal overflow-visible"></span></div>

    <div id="main-container" class="relative z-10 flex flex-col items-end w-[320px] sm:w-[450px] md:w-[550px] px-4 select-none opacity-0 transition-opacity duration-1000">

        </div>

    <script>
        let canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let targetMouseX = mouseX;
        let targetMouseY = mouseY;

        let clickParticles = [];
        window.addEventListener('click', (e) => {
            for (let i = 0; i < 6; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 2 + 0.8;
                clickParticles.push({
                    x: e.clientX,
                    y: e.clientY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 2 + 0.8,
                    alpha: 0.9
                });
            }
        });

        window.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX;
            targetMouseY = e.clientY;
        });

        window.addEventListener('selectstart', (e) => { e.preventDefault(); });
        window.addEventListener('contextmenu', (e) => { e.preventDefault(); });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initDistantStars();
        }
        window.addEventListener('resize', resizeCanvas);

        let distantStars = [];
        let fastDriftStars = [];
        let shootingStars = [];

        function initDistantStars() {
            distantStars = [];
            fastDriftStars = [];
            const count = 220;
            const fastCount = 14;
            const paletteDark = ['#ffffff', '#ffffff', '#e0f2fe', '#fef3c7'];
            
            for (let i = 0; i < count; i++) {
                let tier = Math.random();
                let speedMultiplier = Math.pow(Math.random(), 4.2) * 8.0 + 0.005; 
                let speed = (Math.random() * 0.15 + 0.001) * speedMultiplier;
                let angle = Math.PI * 0.75 + (Math.random() - 0.5) * 0.4;
                let vx = Math.cos(angle) * speed;
                let vy = Math.sin(angle) * speed;

                distantStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: tier < 0.5 ? Math.random() * 0.45 + 0.2 : Math.random() * 0.7 + 0.3,
                    alpha: tier < 0.5 ? Math.random() * 0.6 + 0.4 : Math.random() * 0.85 + 0.5,
                    vx: vx,
                    vy: vy,
                    colorDark: paletteDark[Math.floor(Math.random() * paletteDark.length)]
                });
            }

            for (let i = 0; i < fastCount; i++) {
                let speedCurve = Math.random();
                let speed = speedCurve < 0.3 ? (Math.random() * 0.8 + 0.2) : (Math.random() * 4.5 + 0.6);
                let angle = Math.PI * 0.75 + (Math.random() - 0.5) * 0.35;
                let vx = Math.cos(angle) * speed;
                let vy = Math.sin(angle) * speed;

                fastDriftStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 0.8 + 0.3,
                    alpha: Math.random() * 0.9 + 0.4,
                    vx: vx,
                    vy: vy,
                    colorDark: paletteDark[Math.floor(Math.random() * paletteDark.length)]
                });
            }
        }

        resizeCanvas();

        function spawnShootingStar() {
            if (Math.random() < 0.004 && shootingStars.length < 1) {
                const angles = [Math.PI * 0.75, Math.PI * 0.85, Math.PI * 1.15, Math.PI];
                let travelAngle = angles[Math.floor(Math.random() * angles.length)] + (Math.random() - 0.5) * 0.4;
                let speed = Math.random() * 2.5 + 1.5;
                let vx = Math.cos(travelAngle) * speed;
                let vy = Math.sin(travelAngle) * speed;
                let startX = vx < 0 ? canvas.width + 150 : -150;
                let startY = Math.random() * (canvas.height * 0.6);

                shootingStars.push({ x: startX, y: startY, vx: vx, vy: vy, length: Math.random() * 250 + 150, opacity: 0.9 });
            }
        }

        function renderStars() {
            mouseX += (targetMouseX - mouseX) * 0.05;
            mouseY += (targetMouseY - mouseY) * 0.05;
            let parallaxOffsetX = (mouseX - window.innerWidth / 2) * 0.0001;
            let parallaxOffsetY = (mouseY - window.innerHeight / 2) * 0.0001;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let s of distantStars) {
                s.x += s.vx + parallaxOffsetX;
                s.y += s.vy + parallaxOffsetY;
                if (s.x < -10) s.x = canvas.width + 10;
                if (s.x > canvas.width + 10) s.x = -10;
                if (s.y < -10) s.y = canvas.height + 10;
                if (s.y > canvas.height + 10) s.y = -10;

                ctx.save();
                ctx.globalAlpha = s.alpha;
                ctx.fillStyle = s.colorDark;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            for (let s of fastDriftStars) {
                s.x += s.vx + parallaxOffsetX * 2;
                s.y += s.vy + parallaxOffsetY * 2;
                if (s.x < -15) s.x = canvas.width + 15;
                if (s.x > canvas.width + 15) s.x = -15;
                if (s.y < -15) s.y = canvas.height + 15;
                if (s.y > canvas.height + 15) s.y = -15;

                ctx.save();
                ctx.globalAlpha = s.alpha;
                ctx.fillStyle = s.colorDark;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            spawnShootingStar();

            ctx.lineWidth = 1.0;
            ctx.lineCap = 'round';

            for (let i = clickParticles.length - 1; i >= 0; i--) {
                let p = clickParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.025;

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) clickParticles.splice(i, 1);
            }

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                let s = shootingStars[i];
                s.x += s.vx;
                s.y += s.vy;
                s.opacity -= 0.003;

                ctx.save();
                ctx.globalAlpha = Math.max(0, s.opacity);
                let tailX = s.x - s.vx * 30;
                let tailY = s.y - s.vy * 30;
                let gradient = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.strokeStyle = gradient;
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(tailX, tailY);
                ctx.stroke();
                ctx.restore();

                if (s.opacity <= 0 || s.x < -300 || s.x > canvas.width + 300 || s.y > canvas.height + 200 || s.y < -100) {
                    shootingStars.splice(i, 1);
                }
            }

            requestAnimationFrame(renderStars);
        }

        const firstArtImage = 'https://i2c.seadn.io/ethereum/0x495f947276749ce646f68ac8c248420045cb7b5e/1126738749bec27cb38e1688c15aaf/881126738749bec27cb38e1688c15aaf.jpeg?w=1000';

        for (let i = baseArtCollection.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [baseArtCollection[i], baseArtCollection[j]] = [baseArtCollection[j], baseArtCollection[i]];
        }

        const openseaImages = [firstArtImage, ...baseArtCollection];

        let navigationStack = ['root'];
        let rootLoadCount = 0;
        let centerTickerLoadCount = 0;
        let aumInterval = null;

        function startTypingSequence(text, onComplete) {
            currentActiveText = text;
            charIndex = 0;
            typedIntroEl.textContent = '';
            typedIntroEl.classList.add('typing-cursor');
            if (typedAuthorEl) typedAuthorEl.style.opacity = '0';
            introContainer.style.display = 'block';
            introContainer.style.opacity = '1';
            const appView = document.getElementById('app-view');
            if (appView) appView.classList.add('hidden');

            function typeStep() {
                if (charIndex < currentActiveText.length) {
                    typedIntroEl.textContent += currentActiveText.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeStep, 45);
                } else {
                    setTimeout(() => backspaceStep(onComplete), 1400);
                }
            }
            typeStep();
        }

        function backspaceStep(onComplete) {
            if (charIndex > 0) {
                typedIntroEl.textContent = currentActiveText.substring(0, charIndex - 1);
                charIndex--;
                setTimeout(() => backspaceStep(onComplete), 25);
            } else {
                typedIntroEl.classList.remove('typing-cursor');
                introContainer.style.opacity = '0';
                setTimeout(() => {
                    introContainer.style.display = 'none';
                    if (onComplete) onComplete();
                }, 500);
            }
        }

        function copyEmailToClipboard(email, e) {
            e.stopPropagation();
            const textArea = document.createElement("textarea");
            textArea.value = email;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                const badge = document.getElementById('copied-badge');
                if (badge) {
                    badge.style.opacity = '1';
                    setTimeout(() => { badge.style.opacity = '0'; }, 1500);
                }
            } catch (err) {}
            document.body.removeChild(textArea);
        }

        function setupCenterTicker(container) {
            container.innerHTML = '';

            const wrapper = document.createElement('div');
            wrapper.className = "relative flex items-center justify-center pointer-events-auto select-none";

            const frame = document.createElement('div');
            frame.className = `w-[240px] sm:w-[320px] md:w-[400px] h-[320px] sm:h-[420px] md:h-[520px] overflow-hidden grid grid-cols-3 grid-rows-4 gap-0 relative pointer-events-auto select-none transition-colors duration-800`;
            
            const shouldPhaseIn = (centerTickerLoadCount === 0);
            if (centerTickerLoadCount === 0) centerTickerLoadCount++;

            if (shouldPhaseIn) {
                frame.style.opacity = '0';
                frame.style.animation = `fadeInPhase 2.4s cubic-bezier(0.16, 1, 0.3, 1) 0s forwards`;
            } else {
                frame.style.opacity = '1';
            }

            let indices = new Array(12).fill(-1);
            const imgs = [];

            let availableInitPool = Array.from({length: openseaImages.length}, (_, i) => i);
            for (let i = availableInitPool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [availableInitPool[i], availableInitPool[j]] = [availableInitPool[j], availableInitPool[i]];
            }

            for (let i = 0; i < 12; i++) {
                const cell = document.createElement('div');
                cell.className = 'relative w-full h-full overflow-hidden cursor-pointer transition-colors';
                cell.style.perspective = '600px';
                cell.title = "View on OpenSea";
                cell.onclick = () => {
                    window.open('https://opensea.io/justdieryan', '_blank');
                };

                const img = document.createElement('img');
                const initialChoice = availableInitPool[i % availableInitPool.length];
                indices[i] = initialChoice;
                img.src = openseaImages[initialChoice];
                img.className = 'w-full h-full object-cover transition-transform duration-500 ease-in-out';
                img.style.transformStyle = 'preserve-3d';
                
                if (shouldPhaseIn) {
                    img.classList.add('pixel-glitch-medium');
                    setTimeout(() => img.classList.remove('pixel-glitch-medium'), 700);
                }
                cell.appendChild(img);
                frame.appendChild(cell);
                imgs.push(img);
            }

            wrapper.appendChild(frame);
            container.appendChild(wrapper);

            if (window.artTickerInterval) clearInterval(window.artTickerInterval);

            window.artTickerInterval = setInterval(() => {
                const slotToChange = Math.floor(Math.random() * 12);
                const targetImg = imgs[slotToChange];

                let activeIndices = new Set();
                for (let i = 0; i < 12; i++) {
                    if (indices[i] !== -1) {
                        activeIndices.add(indices[i]);
                    }
                }

                let availableIndices = [];
                for (let i = 0; i < openseaImages.length; i++) {
                    if (!activeIndices.has(i)) {
                        availableIndices.push(i);
                    }
                }
                if (availableIndices.length === 0) {
                    availableIndices = Array.from({length: openseaImages.length}, (_, i) => i);
                }

                    returnItem
                ];
            } else if (currentState === 'research-detail') {
                const res = profileData.research[meta];
                headerItem = { type: 'text', content: res.title, align: 'right' };
                lines = [
                    { type: 'paragraph', content: res.detail, align: 'right', rightJustify: true },
                    headerItem,
                    returnItem
                ];
            }

            lines.forEach(item => {
                const div = document.createElement('div');
                const alignRight = item.align === 'right';

                if (item.type === 'paragraph') {
                    div.className = "flex flex-col w-full text-right items-end mb-1 select-none";
                } else if (alignRight) {
                    div.className = "flex flex-col w-full text-right items-end mb-1 select-none";
                } else {
                    div.className = "flex flex-col w-full text-left items-start mb-1 select-none";
                }

                if (item.type === 'text') {
                    div.className += ` text-white font-semibold text-sm md:text-base select-none pr-0 mb-0.5`;
                    div.innerHTML = item.content;
                } else if (item.type === 'back') {
                    div.className += ` select-none text-zinc-500 hover:text-zinc-300 mb-1 transition-all duration-200 pr-0`;
                    
                    const backContainer = document.createElement('div');
                    backContainer.className = "inline-flex items-center space-x-2.5 justify-end w-full select-none";
                    
                    const returnSpan = document.createElement('span');
                    returnSpan.className = "cursor-pointer select-none transition-all duration-200 hover:-translate-y-0.5";
                    returnSpan.textContent = item.content;
                    returnSpan.onclick = (e) => { e.stopPropagation(); navigateBack(); };
                    
                    const homeSpan = document.createElement('span');
                    homeSpan.className = "inline-flex items-center hover:opacity-100 opacity-70 transition-all duration-200 hover:-translate-y-0.5 cursor-pointer select-none";
                    homeSpan.title = "Return to root page";
                    homeSpan.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>`;
                    homeSpan.onclick = (e) => { e.stopPropagation(); navigateToRoot(); };
                    
                    backContainer.appendChild(returnSpan);
                    backContainer.appendChild(homeSpan);
                    div.appendChild(backContainer);
                } else if (item.type === 'link') {
                    div.className += ` cursor-pointer select-none text-zinc-400 hover:text-white transition-all duration-300 hover:-translate-y-0.5 pr-0`;
                    if (item.url) {
                        div.setAttribute('onclick', `window.open('${item.url}', '_blank')`);
                    } else if (item.action) {
                        div.setAttribute('onclick', item.action);
                    }
                    const span = document.createElement('span');
                    span.innerHTML = item.content;
                    div.appendChild(span);
                } else if (item.type === 'paragraph') {
                    div.className += ` text-zinc-300 text-xs md:text-sm leading-relaxed ${item.rightJustify ? 'text-justify' : (item.justify ? 'text-justify' : 'text-right')} pr-0`;
                    if (item.rightJustify) {
                        div.style.textAlignLast = 'right';
                    }
                    div.innerHTML = item.content;
                }

                appView.appendChild(div);
            });
        }

        function navigateTo(state) {
            navigationStack.push(state);
            renderView();
        }

        function MapsTo(state, idx) {
            navigationStack.push(idx);
            navigationStack.push(state);
            renderView();
        }

        function navigateBack() {
            if (navigationStack.length > 1) {
                navigationStack.pop();
                if (!isNaN(navigationStack[navigationStack.length - 1])) {
                    navigationStack.pop();
                }
            }
            renderView();
        }

        function navigateToRoot() {
            navigationStack = ['root'];
            renderView();
        }

        window.onload = function() {
            renderStars();
            startTypingSequence("Welcome, friend.", () => {
                renderView();
                if (mainContainer) mainContainer.style.opacity = '1';
            });
        };
    </script>
</body>
</html>
