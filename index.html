<!DOCTYPE html>
<html lang="en" class="bg-black h-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>root</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
            position: fixed;
            width: 100%;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            touch-action: manipulation;
        }
        body {
            color: #d4d4d8;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            transition: background-color 0.5s cubic-bezier(0.16, 1, 0.3, 1), color 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform: scale(0.95);
            transform-origin: center;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
        }
        @media (max-width: 768px), (hover: none) {
            body {
                transform: scale(1) !important;
            }
        }
        ::selection {
            background: rgba(255, 255, 255, 0.25) !important;
            color: inherit !important;
        }
        ::-moz-selection {
            background: rgba(255, 255, 255, 0.25) !important;
            color: inherit !important;
        }
        .cursor {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        @keyframes fadeInPhase {
            0% { opacity: 0; transform: translateY(8px); filter: blur(2px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .vignette-overlay {
            background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.65) 90%);
            pointer-events: none;
            transition: background 0.5s ease;
        }
        * {
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            touch-action: manipulation;
            outline: none !important;
            cursor: default !important;
        }
        @keyframes rainbowWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .rainbow-text {
            background: linear-gradient(270deg, #f43f5e, #fbbf24, #34d399, #38bdf8, #818cf8, #e879f9, #f43f5e);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

    <script>
        let canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let targetMouseX = mouseX;
        let targetMouseY = mouseY;
        let audioEnabled = false;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
        }

        function playTone(freq, type, duration, vol = 0.03) {
            if (!audioEnabled) return;
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // Audio context fallback safeguard
            }
        }

        let clickParticles = [];
        window.addEventListener('click', (e) => {
            for (let i = 0; i < 6; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 2 + 0.8;
                clickParticles.push({
                    x: e.clientX,
                    y: e.clientY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 2 + 0.8,
                    alpha: 0.9
                });
            }
        });

        window.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX;
            targetMouseY = e.clientY;
        });

        window.addEventListener('selectstart', (e) => {
            e.preventDefault();
        });

        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initDistantStars();
        }
        window.addEventListener('resize', resizeCanvas);

        let distantStars = [];
        let fastDriftStars = [];
        let shootingStars = [];
        let currentTheme = 'dark';

        function initDistantStars() {
            distantStars = [];
            fastDriftStars = [];
            const count = 220;
            const fastCount = 14;
            const paletteDark = [
                '#ffffff', '#ffffff', '#e0f2fe', '#fef3c7'
            ];
            const paletteLight = [
                '#18181b', '#27272a', '#3f3f46', '#52525b'
            ];
            
            for (let i = 0; i < count; i++) {
                let tier = Math.random();
                let speedMultiplier = Math.pow(Math.random(), 4.2) * 8.0 + 0.005; 
                let speed = (Math.random() * 0.15 + 0.001) * speedMultiplier;
                let angle = Math.PI * 0.75 + (Math.random() - 0.5) * 0.4;
                let vx = Math.cos(angle) * speed;
                let vy = Math.sin(angle) * speed;

                distantStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: tier < 0.5 ? Math.random() * 0.45 + 0.2 : Math.random() * 0.7 + 0.3,
                    alpha: tier < 0.5 ? Math.random() * 0.6 + 0.4 : Math.random() * 0.85 + 0.5,
                    vx: vx,
                    vy: vy,
                    colorDark: paletteDark[Math.floor(Math.random() * paletteDark.length)],
                    colorLight: paletteLight[Math.floor(Math.random() * paletteLight.length)]
                });
            }

            for (let i = 0; i < fastCount; i++) {
                let speedCurve = Math.random();
                let speed = speedCurve < 0.3 ? (Math.random() * 0.8 + 0.2) : (Math.random() * 4.5 + 0.6);
                let angle = Math.PI * 0.75 + (Math.random() - 0.5) * 0.35;
                let vx = Math.cos(angle) * speed;
                let vy = Math.sin(angle) * speed;

                fastDriftStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 0.8 + 0.3,
                    alpha: Math.random() * 0.9 + 0.4,
                    vx: vx,
                    vy: vy,
                    colorDark: paletteDark[Math.floor(Math.random() * paletteDark.length)],
                    colorLight: paletteLight[Math.floor(Math.random() * paletteLight.length)]
                });
            }
        }

        resizeCanvas();

        function spawnShootingStar() {
            if (Math.random() < 0.004 && shootingStars.length < 1) {
                const angles = [
                    Math.PI * 0.75,
                    Math.PI * 0.85,
                    Math.PI * 1.15,
                    Math.PI
                ];
                let travelAngle = angles[Math.floor(Math.random() * angles.length)] + (Math.random() - 0.5) * 0.4;
                let speed = Math.random() * 2.5 + 1.5;
                let vx = Math.cos(travelAngle) * speed;
                let vy = Math.sin(travelAngle) * speed;

                let startX = vx < 0 ? canvas.width + 150 : -150;
                let startY = Math.random() * (canvas.height * 0.6);

                shootingStars.push({
                    x: startX,
                    y: startY,
                    vx: vx,
                    vy: vy,
                    length: Math.random() * 250 + 150,
                    opacity: 0.9
                });
            }
        }

        function renderStars() {
            mouseX += (targetMouseX - mouseX) * 0.05;
            mouseY += (targetMouseY - mouseY) * 0.05;
            let parallaxOffsetX = (mouseX - window.innerWidth / 2) * 0.0001;
            let parallaxOffsetY = (mouseY - window.innerHeight / 2) * 0.0001;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let s of distantStars) {
                s.x += s.vx + parallaxOffsetX;
                s.y += s.vy + parallaxOffsetY;

                if (s.x < -10) s.x = canvas.width + 10;
                if (s.x > canvas.width + 10) s.x = -10;
                if (s.y < -10) s.y = canvas.height + 10;
                if (s.y > canvas.height + 10) s.y = -10;

                ctx.save();
                ctx.globalAlpha = s.alpha;
                ctx.fillStyle = (currentTheme === 'light') ? s.colorLight : s.colorDark;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            for (let s of fastDriftStars) {
                s.x += s.vx + parallaxOffsetX * 2;
                s.y += s.vy + parallaxOffsetY * 2;

                if (s.x < -15) s.x = canvas.width + 15;
                if (s.x > canvas.width + 15) s.x = -15;
                if (s.y < -15) s.y = canvas.height + 15;
                if (s.y > canvas.height + 15) s.y = -15;

                ctx.save();
                ctx.globalAlpha = s.alpha;
                ctx.fillStyle = (currentTheme === 'light') ? s.colorLight : s.colorDark;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            spawnShootingStar();
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';

            for (let i = clickParticles.length - 1; i >= 0; i--) {
                let p = clickParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.025;

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = currentTheme === 'light' ? '#18181b' : '#ffffff';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) {
                    clickParticles.splice(i, 1);
                }
            }

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                let s = shootingStars[i];
                s.x += s.vx;
                s.y += s.vy;
                s.opacity -= 0.003;

                ctx.save();
                ctx.globalAlpha = Math.max(0, s.opacity);
                let tailX = s.x - s.vx * 30;
                let tailY = s.y - s.vy * 30;

                let gradient = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
                if (currentTheme === 'light') {
                    gradient.addColorStop(0, 'rgba(39, 39, 42, 0.95)');
                    gradient.addColorStop(1, 'rgba(39, 39, 42, 0)');
                } else {
                    gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                }
                
                ctx.strokeStyle = gradient;
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(tailX, tailY);
                ctx.stroke();
                ctx.restore();

                if (s.opacity <= 0 || s.x < -300 || s.x > canvas.width + 300 || s.y > canvas.height + 200 || s.y < -100) {
                    shootingStars.splice(i, 1);
                }
            }

            requestAnimationFrame(renderStars);
        }

                                    <span id="live-total-return" class="${isPositiveReturn ? 'text-emerald-500' : 'text-red-500'} font-medium">${isPositiveReturn ? '+' : ''}${totalReturnPct}%</span>

                setTimeout(backspaceIntro, 1100);

            if (charIndex > 0) {
                typedIntroEl.textContent = introText.substring(0, charIndex - 1);

                introContainer.style.display = 'none';

            const currentState = typeof current === 'string' ? current : current.view;

            const mainContainer = document.getElementById('main-container');

            if (mainContainer) {
                mainContainer.classList.remove('items-center');
                mainContainer.classList.add('items-end');

            if (appView) {
                appView.classList.remove('items-center', 'text-center');
                appView.classList.add('items-end', 'text-right');

            if (currentState === 'root') {
                renderRoot(appView);
            } else {
                renderSubView(currentState, meta, appView);

            if (view === 'experience-detail' || view === 'research-detail') {
                navigationStack.push({ view: view, meta: meta });
            } else {
                navigationStack.push(view);
            }
            renderView();
        }

        function navigateBack() {
            playTone(300, 'sine', 0.04, 0.01);
            if (navigationStack.length > 1) {
                navigationStack.pop();
                renderView();
            }
        }

        function navigateToRoot() {
            playTone(350, 'sine', 0.05, 0.01);
            navigationStack = ['root'];
            renderView();
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            playTone(500, 'sine', 0.05, 0.01);
            applyTheme();
            renderView();
        }

        function copyEmailToClipboard(text, e) {
            playTone(850, 'sine', 0.06, 0.01);
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
            } catch (err) {
                // Fallback
            }
            document.body.removeChild(textArea);

            const badge = document.getElementById('copied-badge');
            if (badge) {
                badge.classList.remove('opacity-0');
                badge.classList.add('opacity-100');
                setTimeout(() => {
                    badge.classList.remove('opacity-100');
                    badge.classList.add('opacity-0');
                }, 1200);
            }

            const vignette = document.querySelector('.vignette-overlay');
            if (currentTheme === 'light') {
                document.body.classList.remove('bg-black', 'text-zinc-400');
                document.body.classList.add('bg-zinc-50', 'text-zinc-700');
                if (vignette) {
                    vignette.style.background = 'radial-gradient(circle at center, transparent 40%, rgba(212, 212, 216, 0.4) 90%)';

            } else {
                document.body.classList.remove('bg-zinc-50', 'text-zinc-700');
                document.body.classList.add('bg-black', 'text-zinc-400');
                if (vignette) {
                    vignette.style.background = 'radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.65) 90%)';
                }
            }
        }

            typeIntro();

            window.addEventListener('keydown', (e) => {
                const current = navigationStack[navigationStack.length - 1];
                const currentState = typeof current === 'string' ? current : current.view;

                if (e.key === 'Escape' || e.key === 'Backspace') {
                    if (currentState !== 'root' && document.activeElement.tagName !== 'INPUT') {
                        e.preventDefault();
                        navigateBack();
                    }
                } else if (e.key.toLowerCase() === 't') {
                    toggleTheme();
                } else if (currentState === 'root') {
                    if (e.key === '1') navigateTo('aum');
                    if (e.key === '2') navigateTo('metaepistemology');
                    if (e.key === '3') navigateTo('resume');
                    if (e.key === '4') navigateTo('portal');
                    if (e.key === '5') navigateTo('research');
                }
