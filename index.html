<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>root</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
            position: fixed;
            width: 100%;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            touch-action: manipulation;
        }
        body {
            color: #d4d4d8;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            transition: background-color 0.8s cubic-bezier(0.16, 1, 0.3, 1), color 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transform: scale(0.95);
            transform-origin: center;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
        }
        @media (max-width: 768px), (hover: none) {
            body {
                transform: scale(1) !important;
            }
        }
        ::selection {
            background: rgba(255, 255, 255, 0.25) !important;
            color: inherit !important;
        }
        ::-moz-selection {
            background: rgba(255, 255, 255, 0.25) !important;
            color: inherit !important;
        }
        @keyframes fadeInPhase {
            0% { opacity: 0; transform: translateY(8px); filter: blur(2px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .vignette-overlay {
            background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.65) 90%);
            pointer-events: none;
            transition: background 0.8s ease;
        }
        * {
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            touch-action: manipulation;
            outline: none !important;
            cursor: default !important;
        }
        @keyframes rainbowWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .rainbow-text {
            background: linear-gradient(270deg, #f43f5e, #fbbf24, #34d399, #38bdf8, #818cf8, #e879f9, #f43f5e);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowWave 8s ease infinite;
        }
        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .typing-cursor::after {
            content: '_';
            display: inline-block;
            margin-left: 2px;
            animation: blinkCursor 0.8s infinite;
            font-weight: normal;
        }
    </style>
</head>

    <script>
        let canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let targetMouseX = mouseX;
        let targetMouseY = mouseY;
        let audioEnabled = false;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
        }

        function playTone(freq, type, duration, vol = 0.03) {
            if (!audioEnabled) return;
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // Audio context fallback safeguard
            }
        }

        let clickParticles = [];
        window.addEventListener('click', (e) => {
            audioEnabled = true;
            for (let i = 0; i < 6; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 2 + 0.8;
                clickParticles.push({
                    x: e.clientX,
                    y: e.clientY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 2 + 0.8,
                    alpha: 0.9
                });
            }
        });

        window.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX;
            targetMouseY = e.clientY;
        });

        window.addEventListener('selectstart', (e) => {
            e.preventDefault();
        });

        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initDistantStars();
        }
        window.addEventListener('resize', resizeCanvas);

        let distantStars = [];
        let fastDriftStars = [];
        let shootingStars = [];
        let currentTheme = 'dark';

        function applyTheme() {
            if (currentTheme === 'light') {
                document.body.style.backgroundColor = '#f4f4f5';
                document.body.style.color = '#18181b';
            } else {
                document.body.style.backgroundColor = '#000000';
                document.body.style.color = '#d4d4d8';
            }
        }

        function initDistantStars() {
            distantStars = [];
            fastDriftStars = [];
            const count = 220;
            const fastCount = 14;
            const paletteDark = [
                '#ffffff', '#ffffff', '#e0f2fe', '#fef3c7'
            ];
            const paletteLight = [
                '#18181b', '#27272a', '#3f3f46', '#52525b'
            ];
            
            for (let i = 0; i < count; i++) {
                let tier = Math.random();
                let speedMultiplier = Math.pow(Math.random(), 4.2) * 8.0 + 0.005; 
                let speed = (Math.random() * 0.15 + 0.001) * speedMultiplier;
                let angle = Math.PI * 0.75 + (Math.random() - 0.5) * 0.4;
                let vx = Math.cos(angle) * speed;
                let vy = Math.sin(angle) * speed;

                distantStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: tier < 0.5 ? Math.random() * 0.45 + 0.2 : Math.random() * 0.7 + 0.3,
                    alpha: tier < 0.5 ? Math.random() * 0.6 + 0.4 : Math.random() * 0.85 + 0.5,
                    vx: vx,
                    vy: vy,
                    colorDark: paletteDark[Math.floor(Math.random() * paletteDark.length)],
                    colorLight: paletteLight[Math.floor(Math.random() * paletteLight.length)]
                });
            }

            for (let i = 0; i < fastCount; i++) {
                let speedCurve = Math.random();
                let speed = speedCurve < 0.3 ? (Math.random() * 0.8 + 0.2) : (Math.random() * 4.5 + 0.6);
                let angle = Math.PI * 0.75 + (Math.random() - 0.5) * 0.35;
                let vx = Math.cos(angle) * speed;
                let vy = Math.sin(angle) * speed;

                fastDriftStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 0.8 + 0.3,
                    alpha: Math.random() * 0.9 + 0.4,
                    vx: vx,
                    vy: vy,
                    colorDark: paletteDark[Math.floor(Math.random() * paletteDark.length)],
                    colorLight: paletteLight[Math.floor(Math.random() * paletteLight.length)]
                });
            }
        }

        resizeCanvas();

        function spawnShootingStar() {
            if (Math.random() < 0.004 && shootingStars.length < 1) {
                const angles = [
                    Math.PI * 0.75,
                    Math.PI * 0.85,
                    Math.PI * 1.15,
                    Math.PI
                ];
                let travelAngle = angles[Math.floor(Math.random() * angles.length)] + (Math.random() - 0.5) * 0.4;
                let speed = Math.random() * 2.5 + 1.5;
                let vx = Math.cos(travelAngle) * speed;
                let vy = Math.sin(travelAngle) * speed;

                let startX = vx < 0 ? canvas.width + 150 : -150;
                let startY = Math.random() * (canvas.height * 0.6);

                shootingStars.push({
                    x: startX,
                    y: startY,
                    vx: vx,
                    vy: vy,
                    length: Math.random() * 250 + 150,
                    opacity: 0.9
                });
            }
        }

        function renderStars() {
            mouseX += (targetMouseX - mouseX) * 0.05;
            mouseY += (targetMouseY - mouseY) * 0.05;
            let parallaxOffsetX = (mouseX - window.innerWidth / 2) * 0.0001;
            let parallaxOffsetY = (mouseY - window.innerHeight / 2) * 0.0001;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let s of distantStars) {
                s.x += s.vx + parallaxOffsetX;
                s.y += s.vy + parallaxOffsetY;

                if (s.x < -10) s.x = canvas.width + 10;
                if (s.x > canvas.width + 10) s.x = -10;
                if (s.y < -10) s.y = canvas.height + 10;
                if (s.y > canvas.height + 10) s.y = -10;

                ctx.save();
                ctx.globalAlpha = s.alpha;
                ctx.fillStyle = (currentTheme === 'light') ? s.colorLight : s.colorDark;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            for (let s of fastDriftStars) {
                s.x += s.vx + parallaxOffsetX * 2;
                s.y += s.vy + parallaxOffsetY * 2;

                if (s.x < -15) s.x = canvas.width + 15;
                if (s.x > canvas.width + 15) s.x = -15;
                if (s.y < -15) s.y = canvas.height + 15;
                if (s.y > canvas.height + 15) s.y = -15;

                ctx.save();
                ctx.globalAlpha = s.alpha;
                ctx.fillStyle = (currentTheme === 'light') ? s.colorLight : s.colorDark;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            spawnShootingStar();
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';

            for (let i = clickParticles.length - 1; i >= 0; i--) {
                let p = clickParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.025;

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = currentTheme === 'light' ? '#18181b' : '#ffffff';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) {
                    clickParticles.splice(i, 1);
                }
            }

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                let s = shootingStars[i];
                s.x += s.vx;
                s.y += s.vy;
                s.opacity -= 0.003;

                ctx.save();
                ctx.globalAlpha = Math.max(0, s.opacity);
                let tailX = s.x - s.vx * 30;
                let tailY = s.y - s.vy * 30;

                let gradient = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
                if (currentTheme === 'light') {
                    gradient.addColorStop(0, 'rgba(39, 39, 42, 0.95)');
                    gradient.addColorStop(1, 'rgba(39, 39, 42, 0)');
                } else {
                    gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                }
                
                ctx.strokeStyle = gradient;
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(tailX, tailY);
                ctx.stroke();
                ctx.restore();

                if (s.opacity <= 0 || s.x < -300 || s.x > canvas.width + 300 || s.y > canvas.height + 200 || s.y < -100) {
                    shootingStars.splice(i, 1);
                }
            }

            requestAnimationFrame(renderStars);
        }

                ];
            } else if (currentState === 'research') {
                headerItem = { type: 'text', content: 'Theoretical Researching', align: 'right' };
                let sortedResearch = profileData.research.map((res, originalIdx) => ({ ...res, originalIdx }))
                    .sort((a, b) => a.title.length - b.title.length);
                sortedResearch.forEach((res) => {
                    menuItems.push({ 
                        type: 'research-link', 
                        title: res.title,
                        content: res.title,
                        action: `MapsTo('research-detail', ${res.originalIdx})`, 
                        indent: true,
                        align: 'right'
                    });
                });
                lines = [
                    ...menuItems,
                    headerItem,
                    returnItem
                ];
            } else if (currentState === 'research-detail') {
                const res = profileData.research[meta];
                headerItem = { type: 'text', content: res.title, align: 'right' };
                lines = [
                    { type: 'paragraph', content: res.detail || res.description, align: 'right' },
                    headerItem,
                    returnItem
                ];
            }

            lines.forEach(item => {
                const div = document.createElement('div');
                const alignRight = item.align === 'right';

                if (alignRight) {
                    div.className = "flex flex-col w-full text-right items-end mb-1 select-none";
                } else {
                    div.className = "flex flex-col w-full text-left items-start mb-1 select-none";
                }

                if (item.type === 'text') {
                    div.className += ` ${currentTheme === 'light' ? 'text-zinc-900' : 'text-white'} font-semibold text-sm md:text-base select-none pr-0 mb-0.5`;
                    div.innerHTML = item.content;
                } else if (item.type === 'back') {
                    div.className += ` select-none ${currentTheme === 'light' ? 'text-zinc-500 hover:text-zinc-800' : 'text-zinc-500 hover:text-zinc-300'} mb-1 transition-all duration-200 pr-0`;
                    
                    const backContainer = document.createElement('div');
                    backContainer.className = "inline-flex items-center space-x-2.5 justify-end w-full select-none";
                    
                    const returnSpan = document.createElement('span');
                    returnSpan.className = "cursor-pointer select-none transition-all duration-200 hover:-translate-y-0.5";
                    returnSpan.textContent = item.content;
                    returnSpan.onclick = (e) => { e.stopPropagation(); navigateBack(); };
                    
                    const homeSpan = document.createElement('span');
                    homeSpan.className = "inline-flex items-center hover:opacity-100 opacity-70 transition-all duration-200 hover:-translate-y-0.5 cursor-pointer select-none";
                    homeSpan.title = "Port to root page";
                    homeSpan.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>`;
                    homeSpan.onclick = (e) => { e.stopPropagation(); navigateToRoot(); };
                    
                    backContainer.appendChild(returnSpan);
                    backContainer.appendChild(homeSpan);
                    div.appendChild(backContainer);
                } else if (item.type === 'link') {
                    div.className += ` cursor-pointer select-none ${currentTheme === 'light' ? 'text-zinc-600 hover:text-zinc-900' : 'text-zinc-400 hover:text-white'} transition-all duration-200 hover:-translate-y-0.5 pr-0 mb-0.5`;
                    div.innerHTML = item.content;
                    if (item.url) {
                        div.setAttribute('onclick', `window.open('${item.url}', '_blank')`);
                    } else {
                        div.setAttribute('onclick', item.action);
                    }
                } else if (item.type === 'rainbow-link') {
                    div.className += ` cursor-pointer select-none pr-0 transition-all duration-200 hover:-translate-y-0.5 mb-0.5`;
                    if (item.url) {
                        div.setAttribute('onclick', `window.open('${item.url}', '_blank')`);
                    } else {
                        div.setAttribute('onclick', item.action || "navigateTo('metatrons-cube')");
                    }
                    const span = document.createElement('span');
                    span.className = "rainbow-text font-medium select-none inline-block";
                    span.textContent = item.content;
                    div.appendChild(span);
                } else if (item.type === 'research-link') {
                    div.className += ` cursor-pointer select-none transition-all duration-200 hover:-translate-y-0.5 pr-0 mb-0.5`;
                    div.setAttribute('onclick', item.action);
                    
                    const titleDiv = document.createElement('div');
                    titleDiv.className = `${currentTheme === 'light' ? 'text-zinc-600 hover:text-zinc-900' : 'text-zinc-400 hover:text-white'} transition-colors duration-200 flex items-center justify-end w-full select-none truncate text-xs sm:text-sm leading-relaxed whitespace-nowrap overflow-hidden text-ellipsis text-right`;
                    titleDiv.textContent = item.title;
                    titleDiv.title = item.title;
                    
                    div.appendChild(titleDiv);
                } else if (item.type === 'paragraph') {
                    if (!alignRight) {
                        div.className += ` ${currentTheme === 'light' ? 'text-zinc-600' : 'text-zinc-400'} text-[11px] leading-relaxed pl-0 pr-0 mt-0.5 font-normal not-italic select-none w-full text-left`;
                        div.innerHTML = item.content;
                    } else {
                        div.className += ` ${currentTheme === 'light' ? 'text-zinc-600' : 'text-zinc-400'} text-[11px] leading-relaxed pr-0 mt-0.5 font-normal not-italic select-none w-full`;
                        div.style.textAlign = 'justify';
                        div.style.textAlignLast = 'right';
                        div.innerHTML = item.content;
                    }
                }

                appView.appendChild(div);
            });
        }

        const typedIntroEl = document.getElementById('typed-intro');
        const typedAuthorEl = document.getElementById('typed-author');
        const introContainer = document.getElementById('intro-container');
        const mainContainer = document.getElementById('main-container');

        let charIndex = 0;
        let currentActiveText = "Welcome, friend.";

        function startTypingSequence(text, onComplete) {
            currentActiveText = text;
            charIndex = 0;
            typedIntroEl.textContent = '';
            typedIntroEl.classList.add('typing-cursor');
            if (typedAuthorEl) typedAuthorEl.style.opacity = '0';
            introContainer.style.display = 'block';
            setTimeout(() => {
                introContainer.style.opacity = '1';
            }, 50);
            const appView = document.getElementById('app-view');
            if (appView) appView.classList.add('hidden');

            function typeStep() {
                if (charIndex < currentActiveText.length) {
                    typedIntroEl.textContent += currentActiveText.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeStep, 60);
                } else {
                    setTimeout(() => backspaceStep(onComplete), 1000);
                }
            }
            typeStep();
        }

        function backspaceStep(onComplete) {
            if (charIndex > 0) {
                typedIntroEl.textContent = currentActiveText.substring(0, charIndex - 1);
                charIndex--;
                setTimeout(() => backspaceStep(onComplete), 35);
            } else {
                typedIntroEl.classList.remove('typing-cursor');
                introContainer.style.opacity = '0';
                setTimeout(() => {
                    introContainer.style.display = 'none';
                    if (onComplete) onComplete();
                }, 600);
            }
        }

        function triggerIntroQuote() {
            playTone(350, 'sine', 0.05, 0.01);
            
            if (mainContainer) mainContainer.style.opacity = '0';
            
            setTimeout(() => {
                navigationStack = ['root'];
                let quoteObj = getRandomQuote();
                startFadeInQuote(quoteObj.quote, quoteObj.author);
            }, 600);
        }

        function startFadeInQuote(text, author) {
            introContainer.style.display = 'block';
            typedIntroEl.textContent = text;
            typedIntroEl.classList.remove('typing-cursor');
            if (typedAuthorEl) {
                typedAuthorEl.textContent = `— ${author}`;
            }
            
            setTimeout(() => {
                introContainer.style.opacity = '1';
                if (typedAuthorEl) typedAuthorEl.style.opacity = '1';
            }, 50);

            const appView = document.getElementById('app-view');
            if (appView) appView.classList.add('hidden');

            setTimeout(() => {
                introContainer.style.opacity = '0';
                if (typedAuthorEl) typedAuthorEl.style.opacity = '0';
                setTimeout(() => {
                    introContainer.style.display = 'none';
                    applyTheme();
                    renderView();
                    if (mainContainer) mainContainer.style.opacity = '1';
                }, 600);
            }, 3200);
        }

        function renderView() {
            const appView = document.getElementById('app-view');
            if (!appView) return;
            appView.innerHTML = '';
            appView.classList.remove('hidden');

            const currentState = navigationStack[navigationStack.length - 1];
            if (currentState === 'root') {
                renderRoot(appView);
            } else {
                renderSubView(currentState, null, appView);
            }
        }

        function navigateTo(state) {
            playTone(440, 'sine', 0.04, 0.015);
            navigationStack.push(state);
            renderView();
        }

        function navigateBack() {
            playTone(330, 'sine', 0.04, 0.015);
            if (navigationStack.length > 1) {
                navigationStack.pop();
            }
            renderView();
        }

        function navigateToRoot() {
            playTone(280, 'sine', 0.04, 0.015);
            navigationStack = ['root'];
            renderView();
        }

        function MapsTo(state, idx) {
            playTone(480, 'sine', 0.04, 0.015);
            navigationStack.push(state);
            renderSubView(state, idx, document.getElementById('app-view'));
        }

        function copyEmailToClipboard(email, e) {
            e.stopPropagation();
            playTone(520, 'sine', 0.05, 0.02);
            const textarea = document.createElement('textarea');
            textarea.value = email;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            const badge = document.getElementById('copied-badge');
            if (badge) {
                badge.style.opacity = '1';
                setTimeout(() => {
                    badge.style.opacity = '0';
                }, 1500);
            }
        }

        window.onload = function() {
            renderStars();
            startTypingSequence("Welcome, friend.", () => {
                renderView();
                if (mainContainer) mainContainer.style.opacity = '1';
            });
        };
    </script>
</body>
</html>
